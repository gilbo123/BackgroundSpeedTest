# config  for the server

# the number of days to show on the dashboard
days: 20

# number of days to keep records for
keep_records_for: 180

# the number of seconds between each speed test
# 300 = 5 minutes; 3600 = 1 hour
test_interval: 300 # 5 minutes

# the port to run the server on
port: 5500


