<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Background Speed Test — Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b1017'/%3E%3Cpath fill='%23fbbf24' d='M57 8 L24 58 h20 L39 92 L76 40 h-20 z'/%3E%3C/svg%3E">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', path='css/dashboard.css?v=6') }}">
</head>

<body>
    <header class="header">
        <div class="header-content">
            <div class="brand">
                <span class="brand-mark">&#9889;</span>
                <div>
                    <h1>Background Speed Test</h1>
                    <p class="subtitle">Continuous network performance monitoring</p>
                </div>
            </div>
            <div class="header-meta">
                <span class="status-pill"><span class="status-dot" id="status-dot"></span><span id="status-text">Loading&hellip;</span></span>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="stats-grid" aria-label="Latest speed test results">
            <div class="stat-card">
                <div class="stat-label">Download</div>
                <div class="stat-value"><span id="stat-download" data-dim>&ndash;</span><small>Mbps</small></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Upload</div>
                <div class="stat-value"><span id="stat-upload" data-dim>&ndash;</span><small>Mbps</small></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Latency</div>
                <div class="stat-value"><span id="stat-ping" data-dim>&ndash;</span><small>ms</small></div>
            </div>
            <div class="stat-card stat-card-muted">
                <div class="stat-label">Last test</div>
                <div class="stat-value stat-value-sm"><span id="stat-time" data-dim>&ndash;</span></div>
            </div>
        </section>

        <section class="chart-card" aria-label="Speed test history">
            <div class="chart-card-header">
                <div>
                    <h2>Network Performance</h2>
                    <p class="chart-subtitle"><span id="days-range">…</span></p>
                </div>
                <div class="view-toggle" role="group" aria-label="Time range">
                    <button type="button" data-view="day" aria-pressed="false">Day</button>
                    <button type="button" data-view="week" aria-pressed="false">Week</button>
                    <button type="button" data-view="month" aria-pressed="false">Month</button>
                    <button type="button" data-view="year" aria-pressed="false">Year</button>
                </div>
            </div>
            <div class="chart-holder">
                <canvas id="combinedChart"></canvas>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <span>Powered by <a href="https://github.com/gilbo123/BackgroundSpeedTest">Background Speed Test</a></span>
            <span class="footer-note">Tests run automatically in the background</span>
        </div>
    </footer>
</body>
</html>

    <!-- Scripts after the body so the canvas exists when dashboard.js runs -->
    <script src="{{ url_for('static', path='js/chart.umd.js') }}"></script>
    <script src="{{ url_for('static', path='js/dashboard.js') }}"></script>
